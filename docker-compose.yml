version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: dkgst-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dkgst_master
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/DKGST.API/Dockerfile
    container_name: dkgst-api
    environment:
      - ConnectionStrings__MasterDb=Host=postgres;Database=dkgst_master;Username=postgres;Password=postgres;Port=5432
      - DatabaseProvider=PostgreSQL
      - ASPNETCORE_URLS=https://+:5001;http://+:5000
      - ASPNETCORE_ENVIRONMENT=Development
    ports:
      - "5001:5001"
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ~/.aspnet/https:/root/.aspnet/https:ro

volumes:
  postgres-data:
